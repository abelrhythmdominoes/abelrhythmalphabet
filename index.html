<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABEL Rhythm Alphabet</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { Play, Pause, Info, Volume2 } = LucideReact;

    const browserStorage = {
      async get(key) {
        try { return { value: localStorage.getItem(key) }; } catch(e) { return null; }
      },
      async set(key, val) {
        try { localStorage.setItem(key, val); } catch(e) {}
      }
    };
    window.storage = browserStorage;

    const INSTRUMENTS = {
      snare: { name: '🥁 Snare Drum', description: 'Warm snare sound (default)' },
      kick: { name: '🔊 Kick Drum', description: 'Deep bass drum' },
      hihat: { name: '🎵 Hi-Hat', description: 'Crisp hi-hat sound' },
      clap: { name: '👏 Clap', description: 'Hand clap percussion' },
      cowbell: { name: '🔔 Cowbell', description: 'Classic cowbell' },
      tom: { name: '🪘 Tom', description: 'Mid-range tom drum' },
      rim: { name: '✨ Rim Shot', description: 'Sharp rim click' },
      bass: { name: '🎸 Bass', description: 'Deep bass guitar note' }
    };

    const PATTERNS = {
      primary: [
        { letter: "A'", code: '–', binary: '0', color: '#2d2d2d' },
        { letter: 'A', code: '•', binary: '1', color: '#4ade80' }
      ],
      binarySimple: [
        { letter: "B'", code: '– –', binary: '00', color: '#2d2d2d' },
        { letter: 'B', code: '• •', binary: '11', color: '#eab308' },
        { letter: 'C', code: '• –', binary: '10', color: '#4ade80' },
        { letter: 'D', code: '– •', binary: '01', color: '#ef4444' }
      ],
      ternary: [
        { letter: "E'", code: '– – –', binary: '000', color: '#2d2d2d' },
        { letter: 'E', code: '• • •', binary: '111', color: '#fff' },
        { letter: 'F', code: '• – –', binary: '100', color: '#4ade80' },
        { letter: 'G', code: '– • –', binary: '010', color: '#fff' },
        { letter: 'H', code: '– – •', binary: '001', color: '#fff' },
        { letter: 'I', code: '• • –', binary: '110', color: '#fff' },
        { letter: 'J', code: '– • •', binary: '011', color: '#fff' },
        { letter: 'K', code: '• – •', binary: '101', color: '#fff' }
      ],
      binaryAdvanced: [
        { letter: "L'", code: '– – – –', binary: '0000', color: '#2d2d2d' },
        { letter: 'L', code: '• • • •', binary: '1111', color: '#fff' },
        { letter: 'M', code: '• – – –', binary: '1000', color: '#4ade80' },
        { letter: 'N', code: '– • – –', binary: '0100', color: '#fff' },
        { letter: 'O', code: '– – • –', binary: '0010', color: '#ef4444' },
        { letter: 'P', code: '– – – •', binary: '0001', color: '#fff' },
        { letter: 'Q', code: '• • – –', binary: '1100', color: '#fff' },
        { letter: 'R', code: '– • • –', binary: '0110', color: '#fff' },
        { letter: 'S', code: '– – • •', binary: '0011', color: '#fff' },
        { letter: 'T', code: '• – – •', binary: '1001', color: '#fff' },
        { letter: 'U', code: '• – • –', binary: '1010', color: '#eab308' },
        { letter: 'V', code: '– • – •', binary: '0101', color: '#fff' },
        { letter: 'W', code: '• • • –', binary: '1110', color: '#fff' },
        { letter: 'X', code: '– • • •', binary: '0111', color: '#fff' },
        { letter: 'Y', code: '• – • •', binary: '1011', color: '#fff' },
        { letter: 'Z', code: '• • – •', binary: '1101', color: '#fff' }
      ]
    };

    const CODE_GROUPS = [
      { name: "A' - A", range: 'Primary Letters', n: 1, total: 2, patterns: PATTERNS.primary },
      { name: "B' - D", range: 'Binary Letters (simple)', n: 2, total: 4, patterns: PATTERNS.binarySimple },
      { name: "E' - K", range: 'Ternary Letters', n: 3, total: 8, patterns: PATTERNS.ternary },
      { name: "L' - Z", range: 'Binary Letters (advanced)', n: 4, total: 16, patterns: PATTERNS.binaryAdvanced }
    ];

    const MAX_LAYERS = 4;

    const buildFused = (list) => ({
      letter: list.map((p) => p.letter).join(''),
      code: list.map((p) => p.code).join(' '),
      binary: list.map((p) => p.binary).join(''),
      color: '#60a5fa',
      parts: list
    });

    const CSS = `
    .abel-step{transition:transform .12s ease-out,opacity .12s ease-out,box-shadow .15s ease-out,background-color .12s ease-out;will-change:transform,opacity}
    .abel-dot{border-radius:9999px;background:var(--c);opacity:.55}
    .abel-dash{border-radius:2px;background:var(--c);opacity:.4}
    .abel-step[data-state="hit"]{opacity:1;transform:scale(1.6);box-shadow:0 0 12px 3px var(--c)}
    .abel-dash[data-state="rest"]{opacity:.95;background:#e5e7eb;transform:scaleY(2.4);box-shadow:0 0 6px rgba(229,231,235,.55)}
    .abel-dash[data-state="ghost"]{opacity:.95;transform:scaleY(2.6);box-shadow:0 0 7px var(--c)}
    .abel-tile[data-active="1"]{box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 18px rgba(255,255,255,.15)}
    .abel-bar{height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:6px}
    .abel-bar>div{height:100%;width:100%;background:var(--c);transform-origin:left center;transform:scaleX(0)}
    .abel-beat{width:12px;height:12px;border-radius:9999px;background:#374151;transition:transform .12s ease-out,box-shadow .15s ease-out,background-color .12s ease-out}
    .abel-beat[data-state="on"]{background:#60a5fa;box-shadow:0 0 10px #60a5fa;transform:scale(1.25)}
    .abel-beat[data-state="down"]{background:#4ade80;box-shadow:0 0 12px #4ade80;transform:scale(1.4)}
    .abel-beat[data-muted="1"]{opacity:.5}
    `;

    const DIMS = {
      sm: { dot: 8, dash: 10, dashH: 2, h: 18 },
      md: { dot: 11, dash: 14, dashH: 2, h: 24 },
      lg: { dot: 16, dash: 24, dashH: 3, h: 38 }
    };

    const POP = {
      hit: [{ transform: 'scale(2.1)' }, { transform: 'scale(1.6)' }],
      rest: [{ transform: 'scaleY(3.4)' }, { transform: 'scaleY(2.4)' }],
      ghost: [{ transform: 'scaleY(3.8)' }, { transform: 'scaleY(2.6)' }]
    };

    const accentFor = (c) => (c === '#2d2d2d' ? '#9ca3af' : c);

    const setStepState = (entry, i, state, popMs = 0) => {
      const el = entry && entry.steps[i];
      if (!el) return;
      if (state === 'idle') {
        el.removeAttribute('data-state');
        return;
      }
      el.setAttribute('data-state', state);
      if (popMs && el.animate) {
        try {
          el.animate((el.hasAttribute('data-n') ? POP_N : POP)[state], { duration: popMs, easing: 'ease-out' });
        } catch (e) {}
      }
    };

    const setTileActive = (entry, on) => {
      if (!entry || !entry.tile) return;
      if (on) entry.tile.setAttribute('data-active', '1');
      else entry.tile.removeAttribute('data-active');
    };

    const NOTATION = { on: false, ghost: false };

    const POP_N = {
      hit: [{ transform: 'scale(1.8)' }, { transform: 'scale(1.35)' }],
      rest: [{ transform: 'scale(1.5)' }, { transform: 'scale(1.2)' }],
      ghost: [{ transform: 'scale(1.5)' }, { transform: 'scale(1.2)' }]
    };

    const NOTATION_CSS = `
    .abel-n-fill{fill:var(--c)}
    .abel-n-stroke{stroke:var(--c);fill:none;stroke-linecap:round;stroke-linejoin:round}
    .abel-n-stem{stroke:var(--c);opacity:.85}
    .abel-n-line{stroke:#9ca3af;fill:none;stroke-width:1.2}
    .abel-n-text{fill:#9ca3af;stroke:none}
    .abel-n-step{transform-box:fill-box;transform-origin:center;opacity:.8;transition:transform .12s ease-out,opacity .12s ease-out,filter .15s ease-out}
    .abel-n-ghost{opacity:.55}
    .abel-n-step[data-state="hit"]{opacity:1;transform:scale(1.35);filter:drop-shadow(0 0 5px var(--c))}
    .abel-n-step[data-state="rest"]{opacity:1;transform:scale(1.2);filter:drop-shadow(0 0 4px #e5e7eb)}
    .abel-n-step[data-state="rest"] .abel-n-stroke{stroke:#e5e7eb}
    .abel-n-step[data-state="rest"] .abel-n-fill{fill:#e5e7eb}
    .abel-n-step[data-state="ghost"]{opacity:1;transform:scale(1.2);filter:drop-shadow(0 0 5px var(--c))}
    `;

    const NotationRest = ({ cx, cy, s, f }) => {
      const tr = `translate(${cx} ${cy}) scale(${s})`;
      if (f === 0) {
        return (
          <g transform={tr}>
            <path d="M-2 -10 L3 -4 L-2 1 L2 6 C-4 5 -5 10 0 12" className="abel-n-stroke" strokeWidth="2" />
          </g>
        );
      }
      const h = 9 + 5 * f;
      const y0 = -h / 2;
      const y1 = h / 2;
      const xs = (y) => 2.5 - 5 * ((y - y0) / (y1 - y0));
      const flags = [];
      for (let k = 0; k < f; k++) {
        const yk = y0 + 3 + 5 * k;
        const fx = xs(yk) - 3.4;
        flags.push(
          <g key={k}>
            <circle cx={fx} cy={yk} r="1.9" className="abel-n-fill" />
            <path
              d={`M${fx + 1.3} ${yk + 1.3} Q${xs(yk) - 1} ${yk + 3.2} ${xs(yk + 3.2)} ${yk + 3.2}`}
              className="abel-n-stroke"
              strokeWidth="1.4"
            />
          </g>
        );
      }
      return (
        <g transform={tr}>
          <line x1={xs(y0)} y1={y0} x2={xs(y1)} y2={y1} className="abel-n-stroke" strokeWidth="1.8" />
          {flags}
        </g>
      );
    };

    function NotationView({ viewId, pattern, registry, size = 'md', bar = true, ghostNotes = false }) {
      const rootRef = useRef(null);
      const [w, setW] = useState(0);
      const symbols = pattern.code.split(' ');
      const n = symbols.length;
      const accent = accentFor(pattern.color);

      useEffect(() => {
        if (!document.getElementById('abel-notation-css')) {
          const st = document.createElement('style');
          st.id = 'abel-notation-css';
          st.textContent = NOTATION_CSS;
          document.head.appendChild(st);
        }
      }, []);

      React.useLayoutEffect(() => {
        const el = rootRef.current;
        if (!el) return undefined;
        const update = () => setW(el.clientWidth);
        update();
        if (typeof ResizeObserver === 'undefined') return undefined;
        const ro = new ResizeObserver(update);
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      useEffect(() => {
        const root = rootRef.current;
        if (!root) return undefined;
        const entry = {
          steps: Array.from(root.querySelectorAll('[data-step]')),
          bar: root.querySelector('[data-bar]'),
          tile: root.closest('[data-tile]')
        };
        registry.current.set(viewId, entry);
        return () => {
          if (registry.current.get(viewId) === entry) registry.current.delete(viewId);
          entry.steps.forEach((el) => el.removeAttribute('data-state'));
          if (entry.bar) entry.bar.style.transform = 'scaleX(0)';
          if (entry.tile) entry.tile.removeAttribute('data-active');
        };
      }, [viewId, pattern, registry, ghostNotes]);

      const S = { sm: 0.7, md: 0.9, lg: 1.25 }[size] || 0.9;
      const W = w || n * 24;
      const H = 52 * S;
      const slot = W / n;
      const noteY = 42 * S;
      const stemTop = 16 * S;
      const rx = 4.4 * S;
      const ry = 3.3 * S;
      const f = Math.floor(Math.log2(n));
      const isTuplet = (n & (n - 1)) !== 0;
      const sound = symbols.map((sy) => sy === '•');
      const isNote = sound.map((s) => s || ghostNotes);
      const cx = (i) => (i + 0.5) * slot;
      const stemX = (i) => cx(i) + rx - 0.7 * S;

      const runs = [];
      for (let i = 0; i < n; ) {
        if (isNote[i]) {
          let j = i;
          while (j + 1 < n && isNote[j + 1]) j++;
          runs.push([i, j]);
          i = j + 1;
        } else {
          i++;
        }
      }

      const beams = [];
      const flags = [];
      if (f >= 1) {
        runs.forEach(([a, b]) => {
          if (b > a) {
            for (let k = 0; k < f; k++) {
              beams.push(
                <rect
                  key={`beam-${a}-${k}`}
                  x={stemX(a) - 0.7 * S}
                  y={stemTop + k * 5 * S}
                  width={stemX(b) - stemX(a) + 1.4 * S}
                  height={3.2 * S}
                  rx={0.8}
                  className="abel-n-fill"
                />
              );
            }
          } else {
            for (let k = 0; k < f; k++) {
              const y0 = stemTop + k * 5 * S;
              const sx = stemX(a);
              flags.push(
                <path
                  key={`flag-${a}-${k}`}
                  d={`M${sx} ${y0} C${sx} ${y0 + 5 * S} ${sx + 8 * S} ${y0 + 6 * S} ${sx + 6 * S} ${y0 + 13 * S}`}
                  className="abel-n-stroke"
                  strokeWidth={1.8 * S}
                />
              );
            }
          }
        });
      }

      const bx1 = cx(0) - rx;
      const bx2 = cx(n - 1) + rx + 0.5;
      const by = 8 * S;
      const bmid = (bx1 + bx2) / 2;
      const bgap = 7 * S;

      return (
        <div ref={rootRef} className="w-full" style={{ '--c': accent }}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: 'block', overflow: 'visible' }}>
            <line x1="0" y1={noteY} x2={W} y2={noteY} stroke="#4b5563" strokeWidth="1" />
            {symbols.map((_, i) =>
              isNote[i] ? (
                <line
                  key={`stem-${i}`}
                  x1={stemX(i)}
                  y1={noteY - 0.5 * S}
                  x2={stemX(i)}
                  y2={stemTop}
                  className="abel-n-stem"
                  strokeWidth={1.3 * S}
                />
              ) : null
            )}
            {beams}
            {flags}
            {isTuplet && (
              <g className="abel-n-line">
                <path d={`M${bx1} ${by + 4 * S} L${bx1} ${by} L${bmid - bgap} ${by}`} />
                <path d={`M${bmid + bgap} ${by} L${bx2} ${by} L${bx2} ${by + 4 * S}`} />
                <text
                  x={bmid}
                  y={by + 3.6 * S}
                  textAnchor="middle"
                  fontSize={10 * S}
                  fontStyle="italic"
                  fontWeight="700"
                  className="abel-n-text"
                >
                  {n}
                </text>
              </g>
            )}
            {symbols.map((_, i) => {
              const x = cx(i);
              if (sound[i]) {
                return (
                  <g key={`g-${i}`} data-step data-n="1" className="abel-n-step">
                    <ellipse cx={x} cy={noteY} rx={rx} ry={ry} transform={`rotate(-20 ${x} ${noteY})`} className="abel-n-fill" />
                  </g>
                );
              }
              if (ghostNotes) {
                const pl = x - rx - 3.2 * S;
                const pr = x + rx + 3.2 * S;
                return (
                  <g key={`g-${i}`} data-step data-n="1" className="abel-n-step abel-n-ghost">
                    <ellipse cx={x} cy={noteY} rx={rx} ry={ry} transform={`rotate(-20 ${x} ${noteY})`} className="abel-n-fill" />
                    <path
                      d={`M${pl + 2 * S} ${noteY - 5 * S} Q${pl - 1.5 * S} ${noteY} ${pl + 2 * S} ${noteY + 5 * S}`}
                      className="abel-n-stroke"
                      strokeWidth={1.2 * S}
                    />
                    <path
                      d={`M${pr - 2 * S} ${noteY - 5 * S} Q${pr + 1.5 * S} ${noteY} ${pr - 2 * S} ${noteY + 5 * S}`}
                      className="abel-n-stroke"
                      strokeWidth={1.2 * S}
                    />
                  </g>
                );
              }
              return (
                <g key={`g-${i}`} data-step data-n="1" className="abel-n-step">
                  <NotationRest cx={x} cy={noteY} s={S} f={f} />
                </g>
              );
            })}
          </svg>
          {bar && (
            <div className="abel-bar">
              <div data-bar />
            </div>
          )}
        </div>
      );
    }

    const DotsView = ({ viewId, pattern, registry, size = 'md', bar = true }) => {
      const rootRef = useRef(null);
      const symbols = pattern.code.split(' ');
      const n = symbols.length;
      const d = DIMS[size];
      const accent = accentFor(pattern.color);

      const bounds = [];
      if (pattern.parts) {
        let acc = 0;
        pattern.parts.forEach((p, i) => {
          if (i > 0) bounds.push(acc);
          acc += p.code.split(' ').length;
        });
      }

      useEffect(() => {
        const root = rootRef.current;
        if (!root) return undefined;
        const entry = {
          steps: Array.from(root.querySelectorAll('[data-step]')),
          bar: root.querySelector('[data-bar]'),
          tile: root.closest('[data-tile]')
        };
        registry.current.set(viewId, entry);
        return () => {
          if (registry.current.get(viewId) === entry) registry.current.delete(viewId);
          entry.steps.forEach((el) => el.removeAttribute('data-state'));
          if (entry.bar) entry.bar.style.transform = 'scaleX(0)';
          if (entry.tile) entry.tile.removeAttribute('data-active');
        };
      }, [viewId, pattern, registry]);

      return (
        <div ref={rootRef} className="w-full" style={{ '--c': accent }}>
          <div style={{ position: 'relative', display: 'flex', width: '100%' }}>
            {symbols.map((sy, i) => (
              <div
                key={i}
                style={{
                  flex: '1 1 0',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  height: d.h
                }}
              >
                {sy === '•' ? (
                  <div data-step className="abel-step abel-dot" style={{ width: d.dot, height: d.dot }} />
                ) : (
                  <div data-step className="abel-step abel-dash" style={{ width: d.dash, height: d.dashH }} />
                )}
              </div>
            ))}
            {bounds.map((b) => (
              <div
                key={b}
                style={{
                  position: 'absolute',
                  top: 4,
                  bottom: 4,
                  left: `${(b / n) * 100}%`,
                  width: 1,
                  background: 'rgba(255,255,255,0.22)'
                }}
              />
            ))}
          </div>
          {bar && (
            <div className="abel-bar">
              <div data-bar />
            </div>
          )}
        </div>
      );
    };

    const PatternView = (props) =>
      NOTATION.on ? <NotationView {...props} ghostNotes={NOTATION.ghost} /> : <DotsView {...props} />;

    const DominoCard = ({
      pattern,
      onClick,
      isSelected,
      isInSequence,
      isInFusion,
      isInLayer,
      isSequenceMode,
      isFusionMode,
      isLayerMode,
      isMergeSource,
      onLongPress,
      registry
    }) => {
      const pressRef = useRef({ timer: null, fired: false, x: 0, y: 0 });

      const clearPress = () => {
        clearTimeout(pressRef.current.timer);
        pressRef.current.timer = null;
      };
      const handleDown = (e) => {
        pressRef.current.fired = false;
        if (!onLongPress) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        clearPress();
        pressRef.current.x = e.clientX;
        pressRef.current.y = e.clientY;
        pressRef.current.timer = setTimeout(() => {
          pressRef.current.timer = null;
          pressRef.current.fired = true;
          onLongPress();
        }, 450);
      };
      const handleMove = (e) => {
        const p = pressRef.current;
        if (p.timer && Math.hypot(e.clientX - p.x, e.clientY - p.y) > 10) clearPress();
      };
      const handleClick = (e) => {
        if (pressRef.current.fired) {
          pressRef.current.fired = false;
          return;
        }
        onClick(e);
      };

      return (
        <button
          data-tile
          onClick={handleClick}
          onPointerDown={handleDown}
          onPointerMove={handleMove}
          onPointerUp={clearPress}
          onPointerLeave={clearPress}
          onPointerCancel={clearPress}
          onContextMenu={(e) => e.preventDefault()}
          className={`abel-tile select-none relative flex flex-col items-center justify-center p-3 rounded-lg transition-all border-2 ${
            isMergeSource
              ? 'border-amber-400 bg-gray-700 scale-105'
              : isSelected
              ? 'border-blue-500 bg-gray-700 scale-105'
              : isFusionMode && isInFusion
              ? 'border-blue-400 bg-gray-700'
              : isSequenceMode && isInSequence
              ? 'border-purple-400 bg-gray-700'
              : isLayerMode && isInLayer
              ? 'border-emerald-400 bg-gray-700'
              : 'border-gray-600 bg-gray-800 hover:bg-gray-700 hover:border-gray-500'
          }`}
          style={{ minWidth: '80px' }}
        >
          <div className="text-xs font-bold mb-2" style={{ color: pattern.color }}>
            {pattern.letter}
          </div>
          <PatternView viewId={`grid:${pattern.letter}`} pattern={pattern} registry={registry} size="md" />
          <div className="text-xs text-gray-500 mt-2 font-mono">{pattern.binary}</div>
        </button>
      );
    };

    const makeNoise = (ctx, dur) => {
      const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      return src;
    };

    const playSnare = (ctx, time, vol, dest) => {
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      osc1.frequency.value = 180;
      osc2.frequency.value = 330;
      osc1.type = 'triangle';
      osc2.type = 'triangle';
      const og = ctx.createGain();
      og.gain.setValueAtTime(0, time);
