<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="ABEL Rhythm Alphabet. See it. Feel it. Hear it. Play it." />
  <title>ABEL Rhythm Alphabet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥁%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body { margin: 0; min-height: 100%; background: #111827; }
    #root-loading { color: #9ca3af; font-family: system-ui, sans-serif; padding: 24px; }
  </style>
</head>
<body>
  <div id="root"><div id="root-loading">Loading ABEL Rhythm Alphabet…</div></div>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Lucide icons (React build) -->
  <script crossorigin src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
  <!-- Babel (compiles the JSX below, in the browser) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
/* =====================================================================
   ABEL RHYTHM ALPHABET – single-file app
   ===================================================================== */
const { useState, useEffect, useRef } = React;

/* ---------- Icons (Lucide from the CDN, with built-in fallback) ---------- */
const LucideLib = window.LucideReact || window['lucide-react'] || window.lucideReact || {};
const makeIcon = (children) => ({ size = 24, className = '' }) => (
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width={size}
    height={size}
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    strokeWidth="2"
    strokeLinecap="round"
    strokeLinejoin="round"
    className={className}
  >
    {children}
  </svg>
);
const Play = LucideLib.Play || makeIcon(<polygon points="6 3 20 12 6 21 6 3" />);
const Pause =
  LucideLib.Pause ||
  makeIcon(
    <>
      <rect x="14" y="4" width="4" height="16" rx="1" />
      <rect x="6" y="4" width="4" height="16" rx="1" />
    </>
  );
const Info =
  LucideLib.Info ||
  makeIcon(
    <>
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    </>
  );
const Volume2 =
  LucideLib.Volume2 ||
  makeIcon(
    <>
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
    </>
  );

/* =====================================================================
   DATA
   ===================================================================== */
const INSTRUMENTS = {
  snare: { name: '🥁 Snare Drum', description: 'Warm snare sound (default)' },
  kick: { name: '🔊 Kick Drum', description: 'Deep bass drum' },
  hihat: { name: '🎵 Hi-Hat', description: 'Crisp hi-hat sound' },
  clap: { name: '👏 Clap', description: 'Hand clap percussion' },
  cowbell: { name: '🔔 Cowbell', description: 'Classic cowbell' },
  tom: { name: '🪘 Tom', description: 'Mid-range tom drum' },
  rim: { name: '✨ Rim Shot', description: 'Sharp rim click' },
  bass: { name: '🎸 Bass', description: 'Deep bass guitar note' }
};

const PATTERNS = {
  primary: [
    { letter: "A'", code: '–', binary: '0', color: '#2d2d2d' },
    { letter: 'A', code: '•', binary: '1', color: '#4ade80' }
  ],
  binarySimple: [
    { letter: "B'", code: '– –', binary: '00', color: '#2d2d2d' },
    { letter: 'B', code: '• •', binary: '11', color: '#eab308' },
    { letter: 'C', code: '• –', binary: '10', color: '#4ade80' },
    { letter: 'D', code: '– •', binary: '01', color: '#ef4444' }
  ],
  ternary: [
    { letter: "E'", code: '– – –', binary: '000', color: '#2d2d2d' },
    { letter: 'E', code: '• • •', binary: '111', color: '#fff' },
    { letter: 'F', code: '• – –', binary: '100', color: '#4ade80' },
    { letter: 'G', code: '– • –', binary: '010', color: '#fff' },
    { letter: 'H', code: '– – •', binary: '001', color: '#fff' },
    { letter: 'I', code: '• • –', binary: '110', color: '#fff' },
    { letter: 'J', code: '– • •', binary: '011', color: '#fff' },
    { letter: 'K', code: '• – •', binary: '101', color: '#fff' }
  ],
  binaryAdvanced: [
    { letter: "L'", code: '– – – –', binary: '0000', color: '#2d2d2d' },
    { letter: 'L', code: '• • • •', binary: '1111', color: '#fff' },
    { letter: 'M', code: '• – – –', binary: '1000', color: '#4ade80' },
    { letter: 'N', code: '– • – –', binary: '0100', color: '#fff' },
    { letter: 'O', code: '– – • –', binary: '0010', color: '#ef4444' },
    { letter: 'P', code: '– – – •', binary: '0001', color: '#fff' },
    { letter: 'Q', code: '• • – –', binary: '1100', color: '#fff' },
    { letter: 'R', code: '– • • –', binary: '0110', color: '#fff' },
    { letter: 'S', code: '– – • •', binary: '0011', color: '#fff' },
    { letter: 'T', code: '• – – •', binary: '1001', color: '#fff' },
    { letter: 'U', code: '• – • –', binary: '1010', color: '#eab308' },
    { letter: 'V', code: '– • – •', binary: '0101', color: '#fff' },
    { letter: 'W', code: '• • • –', binary: '1110', color: '#fff' },
    { letter: 'X', code: '– • • •', binary: '0111', color: '#fff' },
    { letter: 'Y', code: '• – • •', binary: '1011', color: '#fff' },
    { letter: 'Z', code: '• • – •', binary: '1101', color: '#fff' }
  ]
};

const CODE_GROUPS = [
  { name: "A' - A", range: 'Primary Letters', n: 1, total: 2, patterns: PATTERNS.primary },
  { name: "B' - D", range: 'Binary Letters (simple)', n: 2, total: 4, patterns: PATTERNS.binarySimple },
  { name: "E' - K", range: 'Ternary Letters', n: 3, total: 8, patterns: PATTERNS.ternary },
  { name: "L' - Z", range: 'Binary Letters (advanced)', n: 4, total: 16, patterns: PATTERNS.binaryAdvanced }
];

const MAX_LAYERS = 4;

// Vibration pulse length (ms): 1 = ghost note, 2 = played note, 3 = beat, 4 = downbeat
const HAPTIC_MS = { 1: 6, 2: 14, 3: 24, 4: 42 };

const buildFused = (list) => ({
  letter: list.map((p) => p.letter).join(''),
  code: list.map((p) => p.code).join(' '),
  binary: list.map((p) => p.binary).join(''),
  color: '#60a5fa',
  parts: list
});

/* =====================================================================
   VISUAL STYLES (animation states are driven by the audio clock)
   ===================================================================== */
const CSS = `
.abel-step{transition:transform .12s ease-out,opacity .12s ease-out,box-shadow .15s ease-out,background-color .12s ease-out;will-change:transform,opacity}
.abel-dot{border-radius:9999px;background:var(--c);opacity:.55}
.abel-dash{border-radius:2px;background:var(--c);opacity:.4}
.abel-step[data-state="hit"]{opacity:1;transform:scale(1.6);box-shadow:0 0 12px 3px var(--c)}
.abel-dash[data-state="rest"]{opacity:.95;background:#e5e7eb;transform:scaleY(2.4);box-shadow:0 0 6px rgba(229,231,235,.55)}
.abel-dash[data-state="ghost"]{opacity:.95;transform:scaleY(2.6);box-shadow:0 0 7px var(--c)}
.abel-tile[data-active="1"]{box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 18px rgba(255,255,255,.15)}
.abel-bar{height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:6px}
.abel-bar>div{height:100%;width:100%;background:var(--c);transform-origin:left center;transform:scaleX(0)}
.abel-beat{width:12px;height:12px;border-radius:9999px;background:#374151;transition:transform .12s ease-out,box-shadow .15s ease-out,background-color .12s ease-out}
.abel-beat[data-state="on"]{background:#60a5fa;box-shadow:0 0 10px #60a5fa;transform:scale(1.25)}
.abel-beat[data-state="down"]{background:#4ade80;box-shadow:0 0 12px #4ade80;transform:scale(1.4)}
.abel-beat[data-muted="1"]{opacity:.5}
`;

const DIMS = {
  sm: { dot: 8, dash: 10, dashH: 2, h: 18 },
  md: { dot: 11, dash: 14, dashH: 2, h: 24 },
  lg: { dot: 16, dash: 24, dashH: 3, h: 38 }
};

const POP = {
  hit: [{ transform: 'scale(2.1)' }, { transform: 'scale(1.6)' }],
  rest: [{ transform: 'scaleY(3.4)' }, { transform: 'scaleY(2.4)' }],
  ghost: [{ transform: 'scaleY(3.8)' }, { transform: 'scaleY(2.6)' }]
};

const accentFor = (c) => (c === '#2d2d2d' ? '#9ca3af' : c);

const setStepState = (entry, i, state, popMs = 0) => {
  const el = entry && entry.steps[i];
  if (!el) return;
  if (state === 'idle') {
    el.removeAttribute('data-state');
    return;
  }
  el.setAttribute('data-state', state);
  if (popMs && el.animate) {
    try {
      el.animate(POP[state], { duration: popMs, easing: 'ease-out' });
    } catch (e) {
      /* ignore */
    }
  }
};

const setTileActive = (entry, on) => {
  if (!entry || !entry.tile) return;
  if (on) entry.tile.setAttribute('data-active', '1');
  else entry.tile.removeAttribute('data-active');
};

/* =====================================================================
   PATTERN VIEW – one animated row of dots / dashes
   (registers itself so the audio-clock animator can drive it directly)
   ===================================================================== */
const PatternView = ({ viewId, pattern, registry, size = 'md', bar = true }) => {
  const rootRef = useRef(null);
  const symbols = pattern.code.split(' ');
  const n = symbols.length;
  const d = DIMS[size];
  const accent = accentFor(pattern.color);

  const bounds = [];
  if (pattern.parts) {
    let acc = 0;
    pattern.parts.forEach((p, i) => {
      if (i > 0) bounds.push(acc);
      acc += p.code.split(' ').length;
    });
  }

  useEffect(() => {
    const root = rootRef.current;
    if (!root) return undefined;
    const entry = {
      steps: Array.from(root.querySelectorAll('[data-step]')),
      bar: root.querySelector('[data-bar]'),
      tile: root.closest('[data-tile]')
    };
    registry.current.set(viewId, entry);
    return () => {
      if (registry.current.get(viewId) === entry) registry.current.delete(viewId);
      entry.steps.forEach((el) => el.removeAttribute('data-state'));
      if (entry.bar) entry.bar.style.transform = 'scaleX(0)';
      if (entry.tile) entry.tile.removeAttribute('data-active');
    };
  }, [viewId, pattern, registry]);

  return (
    <div ref={rootRef} className="w-full" style={{ '--c': accent }}>
      <div style={{ position: 'relative', display: 'flex', width: '100%' }}>
        {symbols.map((sy, i) => (
          <div
            key={i}
            style={{
              flex: '1 1 0',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              height: d.h
            }}
          >
            {sy === '•' ? (
              <div data-step className="abel-step abel-dot" style={{ width: d.dot, height: d.dot }} />
            ) : (
              <div data-step className="abel-step abel-dash" style={{ width: d.dash, height: d.dashH }} />
            )}
          </div>
        ))}
        {bounds.map((b) => (
          <div
            key={b}
            style={{
              position: 'absolute',
              top: 4,
              bottom: 4,
              left: `${(b / n) * 100}%`,
              width: 1,
              background: 'rgba(255,255,255,0.22)'
            }}
          />
        ))}
      </div>
      {bar && (
        <div className="abel-bar">
          <div data-bar />
        </div>
      )}
    </div>
  );
};

/* =====================================================================
   DOMINO CARD (tap = play / add, long-press = start a quick merge)
   ===================================================================== */
const DominoCard = ({
  pattern,
  onClick,
  isSelected,
  isInSequence,
  isInFusion,
  isInLayer,
  isSequenceMode,
  isFusionMode,
  isLayerMode,
  isMergeSource,
  onLongPress,
  registry
}) => {
  const pressRef = useRef({ timer: null, fired: false, x: 0, y: 0 });

  const clearPress = () => {
    clearTimeout(pressRef.current.timer);
    pressRef.current.timer = null;
  };
  const handleDown = (e) => {
    pressRef.current.fired = false;
    if (!onLongPress) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    clearPress();
    pressRef.current.x = e.clientX;
    pressRef.current.y = e.clientY;
    pressRef.current.timer = setTimeout(() => {
      pressRef.current.timer = null;
      pressRef.current.fired = true;
      onLongPress();
    }, 450);
  };
  const handleMove = (e) => {
    const p = pressRef.current;
    if (p.timer && Math.hypot(e.clientX - p.x, e.clientY - p.y) > 10) clearPress(); // finger is scrolling
  };
  const handleClick = (e) => {
    if (pressRef.current.fired) {
      pressRef.current.fired = false; // the click that ends a long-press is not a tap
      return;
    }
    onClick(e);
  };

  return (
    <button
      data-tile
      onClick={handleClick}
      onPointerDown={handleDown}
      onPointerMove={handleMove}
      onPointerUp={clearPress}
      onPointerLeave={clearPress}
      onPointerCancel={clearPress}
      onContextMenu={(e) => e.preventDefault()}
      className={`abel-tile select-none relative flex flex-col items-center justify-center p-3 rounded-lg transition-all border-2 ${
        isMergeSource
          ? 'border-amber-400 bg-gray-700 scale-105'
          : isSelected
          ? 'border-blue-500 bg-gray-700 scale-105'
          : isFusionMode && isInFusion
          ? 'border-blue-400 bg-gray-700'
          : isSequenceMode && isInSequence
          ? 'border-purple-400 bg-gray-700'
          : isLayerMode && isInLayer
          ? 'border-emerald-400 bg-gray-700'
          : 'border-gray-600 bg-gray-800 hover:bg-gray-700 hover:border-gray-500'
      }`}
      style={{ minWidth: '80px' }}
    >
      <div className="text-xs font-bold mb-2" style={{ color: pattern.color }}>
        {pattern.letter}
      </div>
      <PatternView viewId={`grid:${pattern.letter}`} pattern={pattern} registry={registry} size="md" />
      <div className="text-xs text-gray-500 mt-2 font-mono">{pattern.binary}</div>
    </button>
  );
};

/* =====================================================================
   AUDIO – synthesised instruments (all routed to a master gain so that
   Stop silences everything instantly, even notes already scheduled)
   ===================================================================== */
const makeNoise = (ctx, dur) => {
  const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * dur)), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  return src;
};

const playSnare = (ctx, time, vol, dest) => {
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  osc1.frequency.value = 180;
  osc2.frequency.value = 330;
  osc1.type = 'triangle';
  osc2.type = 'triangle';
  const og = ctx.createGain();
  og.gain.setValueAtTime(0, time);
  og.gain.linearRampToValueAtTime(0.25 * vol, time + 0.001);
  og.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
  osc1.connect(og);
  osc2.connect(og);
  og.connect(dest);

  const noise = makeNoise(ctx, 0.15);
  const f = ctx.createBiquadFilter();
  f.type = 'highpass';
  f.frequency.value = 2000;
  f.Q.value = 1;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0, time);
  ng.gain.linearRampToValueAtTime(0.35 * vol, time + 0.001);
  ng.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
  noise.connect(f);
  f.connect(ng);
  ng.connect(dest);

  osc1.start(time);
  osc1.stop(time + 0.08);
  osc2.start(time);
  osc2.stop(time + 0.08);
  noise.start(time);
  noise.stop(time + 0.15);
};

const playKick = (ctx, time, vol, dest) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(40, time + 0.1);
  gain.gain.setValueAtTime(0.8 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(time);
  osc.stop(time + 0.3);
};

const playHiHat = (ctx, time, vol, dest) => {
  const noise = makeNoise(ctx, 0.1);
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 7000;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.3 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(dest);
  noise.start(time);
  noise.stop(time + 0.1);
};

const playClap = (ctx, time, vol, dest) => {
  for (let i = 0; i < 3; i++) {
    const noise = makeNoise(ctx, 0.08);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1500;
    filter.Q.value = 2;
    const gain = ctx.createGain();
    const t = time + i * 0.01;
    gain.gain.setValueAtTime(0.25 * vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(dest);
    noise.start(t);
    noise.stop(t + 0.08);
  }
};

const playCowbell = (ctx, time, vol, dest) => {
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  osc1.frequency.value = 540;
  osc2.frequency.value = 800;
  osc1.type = 'square';
  osc2.type = 'square';
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.3 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(dest);
  osc1.start(time);
  osc1.stop(time + 0.15);
  osc2.start(time);
  osc2.stop(time + 0.15);
};

const playTom = (ctx, time, vol, dest) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.setValueAtTime(220, time);
  osc.frequency.exponentialRampToValueAtTime(110, time + 0.15);
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.5 * vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(time);
  osc.stop(time + 0.2);
};

const playRimShot = (ctx, time, vol, dest) => {
  const osc = ctx.createOscillator();
  osc.frequency.value = 400;
  osc.type = 'square';
  const noise = makeNoise(ctx, 0.02);
  const oscGain = ctx.createGain();
  const noiseGain = ctx.createGain();
  oscGain.gain.setValueAtTime(0.2 * vol, time);
  oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.02);
  noiseGain.gain.setValueAtTime(0.4 * vol, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.015);
  osc.connect(oscGain);
  oscGain.connect(dest);
  noise.connect(noiseGain);
  noiseGain.connect(dest);
  osc.start(time);
  osc.stop(time + 0.02);
  noise.start(time);
  noise.stop(time + 0.02);
};

const playBass = (ctx, time, vol, dest) => {
  const fundamental = ctx.createOscillator();
  const harmonic1 = ctx.createOscillator();
  const harmonic2 = ctx.createOscillator();
  fundamental.frequency.value = 41.2;
  harmonic1.frequency.value = 82.4;
  harmonic2.frequency.value = 123.6;
  fundamental.type = 'sine';
  harmonic1.type = 'sine';
  harmonic2.type = 'sine';

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 600;
  filter.Q.value = 1;

  const fg = ctx.createGain();
  const h1g = ctx.createGain();
  const h2g = ctx.createGain();
  const master = ctx.createGain();

  fg.gain.setValueAtTime(0, time);
  fg.gain.linearRampToValueAtTime(0.5 * vol, time + 0.01);
  fg.gain.linearRampToValueAtTime(0.35 * vol, time + 0.05);
  fg.gain.setValueAtTime(0.35 * vol, time + 0.2);
  fg.gain.exponentialRampToValueAtTime(0.001, time + 0.4);

  h1g.gain.setValueAtTime(0, time);
  h1g.gain.linearRampToValueAtTime(0.2 * vol, time + 0.01);
  h1g.gain.exponentialRampToValueAtTime(0.001, time + 0.35);

  h2g.gain.setValueAtTime(0, time);
  h2g.gain.linearRampToValueAtTime(0.1 * vol, time + 0.01);
  h2g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);

  master.gain.value = 0.6;

  fundamental.connect(fg);
  harmonic1.connect(h1g);
  harmonic2.connect(h2g);
  fg.connect(filter);
  h1g.connect(filter);
  h2g.connect(filter);
  filter.connect(master);
  master.connect(dest);

  fundamental.start(time);
  fundamental.stop(time + 0.4);
  harmonic1.start(time);
  harmonic1.stop(time + 0.35);
  harmonic2.start(time);
  harmonic2.stop(time + 0.3);
};

const INSTRUMENT_FN = {
  snare: playSnare,
  kick: playKick,
  hihat: playHiHat,
  clap: playClap,
  cowbell: playCowbell,
  tom: playTom,
  rim: playRimShot,
  bass: playBass
};

// Every instrument is rendered ONCE (same synth, rendered offline into a buffer) so that each
// hit is identical: same pitch sweep, same level, same noise, and much lighter on the CPU.
const renderSamples = async (ctx) => {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return null;
  const out = {};
  try {
    for (const key of Object.keys(INSTRUMENT_FN)) {
      const off = new OAC(1, Math.ceil(ctx.sampleRate * 0.5), ctx.sampleRate);
      INSTRUMENT_FN[key](off, 0, 1, off.destination);
      out[key] = await off.startRendering();
    }
  } catch (e) {
    return null; // fall back to live synthesis
  }
  return out;
};

const CHOKE_TIME = 0.004;

const playInstrument = (ctx, time, instrument, isGhost, dest, samples, voices, lane) => {
  const vol = isGhost ? 0.1 : 1;
  const buf = samples && samples[instrument];
  if (!buf) {
    // samples not ready (or unsupported): live synthesis
    (INSTRUMENT_FN[instrument] || playSnare)(ctx, time, vol, dest);
    return;
  }

  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.value = vol;
  src.connect(gain);
  gain.connect(dest);

  // One voice per instrument and lane: when a new hit starts, the previous one is faded out in
  // 4 ms. Tails no longer pile up on fast repeats, so level and pitch stay constant.
  const key = `${instrument}:${lane}`;
  const prev = voices && voices.get(key);
  if (prev && time > prev.start) {
    const from = Math.max(prev.start, time - CHOKE_TIME);
    prev.gain.gain.setValueAtTime(prev.vol, from);
    prev.gain.gain.linearRampToValueAtTime(0, time);
  }
  if (voices) voices.set(key, { gain, start: time, vol });

  src.start(time);
};

const playClick = (ctx, time, isDownbeat, dest) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(dest);
  osc.frequency.value = isDownbeat ? 800 : 1200;
  osc.type = 'sine';
  const dur = 0.04;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(isDownbeat ? 0.25 : 0.15, time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.start(time);
  osc.stop(time + dur);
};

/* Time of the audio that is actually being HEARD right now
   (compensates the browser's reported output latency). */
const getHeardTime = (ctx) => {
  try {
    if (typeof ctx.getOutputTimestamp === 'function') {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        const t = ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
        if (t <= ctx.currentTime + 0.02 && t >= ctx.currentTime - 0.6) return t;
      }
    }
  } catch (e) {
    /* fall back below */
  }
  return ctx.currentTime - Math.min(ctx.outputLatency || 0, 0.5);
};

/* =====================================================================
   MAIN COMPONENT
   ===================================================================== */
const ABELRhythmDominoes = () => {
  /* ---------------- State ---------------- */
  const [showInfo, setShowInfo] = useState(true);
  const [tempo, setTempo] = useState(120);
  const [metronomeEnabled, setMetronomeEnabled] = useState(true);
  const [ghostNotesEnabled, setGhostNotesEnabled] = useState(true);
  const [syncOffset, setSyncOffset] = useState(0);
  const [showSync, setShowSync] = useState(false);
  const [hapticsEnabled, setHapticsEnabled] = useState(true); // on by default (a saved choice overrides it)
  const [beatsPerBar, setBeatsPerBar] = useState(4);
  const [selectedInstrument, setSelectedInstrument] = useState('snare');
  const [selectedPattern, setSelectedPattern] = useState(null);
  const [playKind, setPlayKind] = useState(null); // null | 'solo' | 'sequence' | 'fused' | 'layers'
  const [sequence, setSequence] = useState([]);
  const [isSequenceMode, setIsSequenceMode] = useState(false);
  const [isFusionMode, setIsFusionMode] = useState(false);
  const [isLayerMode, setIsLayerMode] = useState(false);
  const [fusionPatterns, setFusionPatterns] = useState([]);
  const [fusedPattern, setFusedPattern] = useState(null);
  const [layers, setLayers] = useState([
    { pattern: null, instrument: 'snare' },
    { pattern: null, instrument: 'kick' },
    { pattern: null, instrument: 'hihat' },
    { pattern: null, instrument: 'clap' }
  ]);
  const [activeLayer, setActiveLayer] = useState(0);
  const [dragState, setDragState] = useState(null); // { from, over, after, x, y }
  const [mergeFirst, setMergeFirst] = useState(null);
  const [tempoDraft, setTempoDraft] = useState(null); // text being typed (null = show the real tempo)

  const isPlaying = playKind !== null;

  /* ---------------- Refs ---------------- */
  // Engine
  const ctxRef = useRef(null);
  const masterRef = useRef(null);
  const schedulerIdRef = useRef(null);
  const rafRef = useRef(null);
  const nextBeatRef = useRef(0);
  const beatCountRef = useRef(0);
  const seqPosRef = useRef(0);
  const segIdRef = useRef(0);
  const segmentsRef = useRef([]);
  const playRef = useRef(null);
  const samplesRef = useRef(null);
  const voicesRef = useRef(new Map());

  // Live values read by the audio scheduler / animator (no stale closures)
  const settingsRef = useRef({});
  const sequenceRef = useRef([]);
  const fusedRef = useRef(null);
  const layersRef = useRef([]);
  settingsRef.current = {
    tempo,
    metronome: metronomeEnabled,
    ghost: ghostNotesEnabled,
    instrument: selectedInstrument,
    sync: syncOffset,
    beats: beatsPerBar
  };
  sequenceRef.current = sequence;
  fusedRef.current = fusedPattern;
  layersRef.current = layers;

  // Animation
  const registryRef = useRef(new Map());
  const litRef = useRef(new Map());
  const beatsContainerRef = useRef(null);
  const beatElsRef = useRef([]);
  const beatLitRef = useRef({ segId: null });

  // Haptics
  const hapticsOnRef = useRef(false);
  const hapticLastRef = useRef({ segId: null, steps: [] });

  // Sequence drag & drop + "added" feedback
  const dragRef = useRef(null);
  const seqTileRefs = useRef([]);
  const dragChipRef = useRef(null);
  const prevSeqLenRef = useRef(0);
  const seqCountRef = useRef(null);
  const pillElRef = useRef(null);
  const pillTimerRef = useRef(null);

  // Tempo input
  const tempoHoldRef = useRef({ t: null, i: null });
  const tempoSkipRef = useRef(false);

  /* ---------------- Haptics (Web Vibration API, with graceful fallback) ---------------- */
  const hapticsSupported = typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function';
  const safeVibrate = (pattern) => {
    try {
      if (hapticsSupported) return navigator.vibrate(pattern);
    } catch (e) {
      /* never let haptics break audio playback */
    }
    return false;
  };
  hapticsOnRef.current = hapticsEnabled && hapticsSupported;

  // Called from the audio-clock animator: fires exactly when a beat / note is heard
  const fireHaptics = (seg, p) => {
    if (!hapticsOnRef.current) return;
    try {
      const h = hapticLastRef.current;
      let level = 0;
      if (h.segId !== seg.id) {
        h.segId = seg.id;
        h.steps = seg.tracks.map(() => -1);
        if (seg.metro) level = seg.beatPos === 0 ? 4 : 3; // mirrors the audible metronome click
      }
      seg.tracks.forEach((track, ti) => {
        const step = Math.min(track.n - 1, Math.floor(p * track.n));
        if (h.steps[ti] !== step) {
          h.steps[ti] = step;
          if (track.sound[step]) level = Math.max(level, 2);
          else if (seg.ghost) level = Math.max(level, 1);
        }
      });
      if (level) safeVibrate(HAPTIC_MS[level]);
    } catch (e) {
      /* ignore */
    }
  };

  const toggleHaptics = () => {
    if (!hapticsSupported) return;
    const next = !hapticsEnabled;
    setHapticsEnabled(next);
    safeVibrate(next ? 30 : 0); // short confirmation buzz when switched on
    try {
      localStorage.setItem('abel:haptics', next ? '1' : '0');
    } catch (e) {
      /* preference could not be saved: ignore */
    }
  };

  /* ---------------- Effects: setup / cleanup ---------------- */
  useEffect(() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctxRef.current = new AC();
    const createdCtx = ctxRef.current;
    renderSamples(createdCtx)
      .then((s) => {
        if (ctxRef.current === createdCtx) samplesRef.current = s;
      })
      .catch(() => {});
    beatElsRef.current = beatsContainerRef.current
      ? Array.from(beatsContainerRef.current.querySelectorAll('[data-beat]'))
      : [];
    return () => {
      if (schedulerIdRef.current) clearInterval(schedulerIdRef.current);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (ctxRef.current) {
        ctxRef.current.close().catch(() => {});
      }
    };
  }, []);

  // Restore the saved haptics preference
  useEffect(() => {
    try {
      const v = localStorage.getItem('abel:haptics');
      if (v !== null) setHapticsEnabled(v === '1');
    } catch (e) {
      /* no saved preference */
    }
  }, []);

  // Re-collect the beat lights whenever their number changes
  useEffect(() => {
    beatElsRef.current = beatsContainerRef.current
      ? Array.from(beatsContainerRef.current.querySelectorAll('[data-beat]'))
      : [];
    beatLitRef.current.segId = null;
  }, [beatsPerBar]);

  // Keeps the page from scrolling while a sequence frame is being dragged (must be non-passive)
  useEffect(() => {
    const block = (e) => {
      if (dragRef.current && e.cancelable) e.preventDefault();
    };
    window.addEventListener('touchmove', block, { passive: false });
    return () => window.removeEventListener('touchmove', block);
  }, []);

  useEffect(() => {
    if (isFusionMode) setMergeFirst(null); // quick merge is not needed in Fusion mode
  }, [isFusionMode]);

  /* ---------------- Animator (driven by the audio clock) ---------------- */
  const clearLit = () => {
    for (const [, prev] of litRef.current) {
      setStepState(prev.entry, prev.idx, 'idle');
      setTileActive(prev.entry, false);
      if (prev.entry.bar) prev.entry.bar.style.transform = 'scaleX(0)';
    }
    litRef.current.clear();
    beatLitRef.current.segId = null;
    beatElsRef.current.forEach((e) => {
      e.removeAttribute('data-state');
      e.removeAttribute('data-muted');
    });
  };

  const applyBeat = (seg) => {
    const els = beatElsRef.current;
    const b = beatLitRef.current;
    if (!seg) {
      if (b.segId !== null) {
        els.forEach((e) => e.removeAttribute('data-state'));
        b.segId = null;
      }
      return;
    }
    if (b.segId === seg.id) return;
    b.segId = seg.id;
    els.forEach((e, i) => {
      if (i === seg.beatPos) e.setAttribute('data-state', i === 0 ? 'down' : 'on');
      else e.removeAttribute('data-state');
      e.setAttribute('data-muted', seg.metro ? '0' : '1');
    });
    const el = els[seg.beatPos];
    if (el && el.animate) {
      try {
        el.animate(
          [{ transform: 'scale(2.2)' }, { transform: seg.beatPos === 0 ? 'scale(1.4)' : 'scale(1.25)' }],
          { duration: 200, easing: 'ease-out' }
        );
      } catch (e) {
        /* ignore */
      }
    }
  };

  const applyFrame = (frame) => {
    const reg = registryRef.current;
    const lit = litRef.current;
    const active = new Set();

    if (frame) {
      const { seg, p } = frame;
      for (const track of seg.tracks) {
        const step = Math.min(track.n - 1, Math.floor(p * track.n));
        const popMs = Math.max(60, Math.min((seg.dur / track.n) * 1000, 260));
        for (const tg of track.targets) {
          const entry = reg.get(tg.viewId);
          if (!entry) continue;
          const local = step - tg.offset;
          if (local < 0 || local >= tg.count) continue;
          active.add(tg.viewId);
          const prev = lit.get(tg.viewId);
          if (!prev || prev.entry !== entry || prev.idx !== local || prev.segId !== seg.id) {
            if (prev && prev.entry === entry) setStepState(entry, prev.idx, 'idle');
            const state = track.sound[step] ? 'hit' : seg.ghost ? 'ghost' : 'rest';
            setStepState(entry, local, state, popMs);
            setTileActive(entry, true);
            lit.set(tg.viewId, { entry, idx: local, segId: seg.id });
          }
          if (entry.bar && tg.count === track.n) {
            entry.bar.style.transform = `scaleX(${p.toFixed(4)})`;
          }
        }
      }
    }

    for (const [id, prev] of lit) {
      if (!active.has(id)) {
        setStepState(prev.entry, prev.idx, 'idle');
        setTileActive(prev.entry, false);
        if (prev.entry.bar) prev.entry.bar.style.transform = 'scaleX(0)';
        lit.delete(id);
      }
    }

    applyBeat(frame ? frame.seg : null);
  };

  const animate = () => {
    rafRef.current = requestAnimationFrame(animate);
    const ctx = ctxRef.current;
    if (!ctx || !playRef.current) return;

    const now = getHeardTime(ctx) - settingsRef.current.sync / 1000;
    const q = segmentsRef.current;
    while (q.length > 1 && q[1].start <= now) q.shift();
    const seg = q[0];

    if (!seg || now < seg.start || now >= seg.start + seg.dur) {
      applyFrame(null);
      return;
    }
    const p = (now - seg.start) / seg.dur;
    fireHaptics(seg, p);
    applyFrame({ seg, p });
  };

  /* ---------------- Scheduler (audio + visual timeline together) ---------------- */
  const scheduleBeat = (ctx, t) => {
    const s = settingsRef.current;
    const play = playRef.current;
    const dest = masterRef.current;
    if (!play || !dest) return false;

    const beat = 60 / s.tempo;

    // 1) Decide which tracks play on this beat
    const defs = [];
    if (play.mode === 'solo') {
      if (play.pattern) {
        defs.push({
          pattern: play.pattern,
          instrument: s.instrument,
          viewIds: [`grid:${play.pattern.letter}`, 'info']
        });
      }
    } else if (play.mode === 'fused') {
      const fp = fusedRef.current;
      if (fp) {
        defs.push({ pattern: fp, instrument: s.instrument, viewIds: ['fused-result', 'info'], withParts: true });
      }
    } else if (play.mode === 'sequence') {
      const seq = sequenceRef.current;
      if (seq.length) {
        const idx = seqPosRef.current % seq.length;
        seqPosRef.current = idx + 1;
        const pat = seq[idx];
        const viewIds = [`seq:${idx}`];
        if (!pat.parts) viewIds.push(`grid:${pat.letter}`);
        defs.push({ pattern: pat, instrument: s.instrument, viewIds });
      }
    } else {
      layersRef.current.forEach((layer, i) => {
        if (layer.pattern) {
          defs.push({
            pattern: layer.pattern,
            instrument: layer.instrument,
            viewIds: [`layer:${i}`, `grid:${layer.pattern.letter}`]
          });
        }
      });
    }
    if (defs.length === 0) return false;

    // 2) Metronome click
    const beatPos = beatCountRef.current % Math.max(1, s.beats);
    beatCountRef.current += 1;
    if (s.metronome) playClick(ctx, t, beatPos === 0, dest);

    // 3) Audio for every track + matching visual timeline
    const tracks = defs.map((def) => {
      const symbols = def.pattern.code.split(' ');
      const n = symbols.length;
      const sound = symbols.map((sy) => sy === '•');
      const targets = def.viewIds.map((viewId) => ({ viewId, offset: 0, count: n }));
      if (def.withParts && def.pattern.parts) {
        let off = 0;
        def.pattern.parts.forEach((part, k) => {
          const c = part.code.split(' ').length;
          targets.push({ viewId: `fpart:${k}`, offset: off, count: c });
          off += c;
        });
      }
      const stepDur = beat / n;
      const lane = def.viewIds[0].startsWith('layer:') ? def.viewIds[0] : 'main';
      const samples = samplesRef.current;
      const voices = voicesRef.current;
      for (let i = 0; i < n; i++) {
        const tt = t + i * stepDur;
        if (sound[i]) playInstrument(ctx, tt, def.instrument, false, dest, samples, voices, lane);
        else if (s.ghost) playInstrument(ctx, tt, def.instrument, true, dest, samples, voices, lane);
      }
      return { n, sound, targets };
    });

    segmentsRef.current.push({
      id: ++segIdRef.current,
      start: t,
      dur: beat,
      ghost: s.ghost,
      metro: s.metronome,
      beatPos,
      tracks
    });

    nextBeatRef.current = t + beat;
    return true;
  };

  const scheduler = () => {
    const ctx = ctxRef.current;
    if (!ctx || !playRef.current) return;
    const ahead = 0.2;
    if (nextBeatRef.current < ctx.currentTime - 0.05) {
      nextBeatRef.current = ctx.currentTime + 0.05; // resync if the page was throttled
    }
    while (nextBeatRef.current < ctx.currentTime + ahead) {
      if (!scheduleBeat(ctx, nextBeatRef.current)) {
        stopPlayback();
        return;
      }
    }
    const q = segmentsRef.current;
    while (q.length > 8) q.shift();
  };

  const stopEngine = () => {
    if (schedulerIdRef.current) {
      clearInterval(schedulerIdRef.current);
      schedulerIdRef.current = null;
    }
    if (rafRef.current) {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
    }
    playRef.current = null;
    segmentsRef.current = [];

    const ctx = ctxRef.current;
    const m = masterRef.current;
    if (m && ctx) {
      try {
        const now = ctx.currentTime;
        m.gain.cancelScheduledValues(now);
        m.gain.setValueAtTime(m.gain.value, now);
        m.gain.linearRampToValueAtTime(0, now + 0.01);
      } catch (e) {
        /* ignore */
      }
      setTimeout(() => {
        try {
          m.disconnect();
        } catch (e) {
          /* ignore */
        }
      }, 150);
    }
    masterRef.current = null;
    hapticLastRef.current = { segId: null, steps: [] };
    safeVibrate(0); // cancel any vibration in progress
    clearLit();
  };

  const startPlayback = (mode, pattern) => {
    const ctx = ctxRef.current;
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();

    stopEngine();

    const master = ctx.createGain();
    master.gain.value = mode === 'layers' ? 0.7 : 1; // headroom when several instruments play together
    master.connect(ctx.destination);
    masterRef.current = master;

    playRef.current = { mode, pattern };
    segmentsRef.current = [];
    beatCountRef.current = 0;
    seqPosRef.current = 0;
    nextBeatRef.current = ctx.currentTime + 0.08;

    scheduler();
    schedulerIdRef.current = setInterval(scheduler, 25);
    rafRef.current = requestAnimationFrame(animate);
  };

  const stopPlayback = () => {
    stopEngine();
    setPlayKind(null);
    setSelectedPattern(null);
  };

  /* ---------------- UI actions ---------------- */
  const assignToLayer = (pattern) => {
    const next = layers.map((l, i) => (i === activeLayer ? { ...l, pattern } : l));
    setLayers(next);
    // move the selection to the next empty slot (if any)
    for (let k = 1; k <= MAX_LAYERS; k++) {
      const j = (activeLayer + k) % MAX_LAYERS;
      if (!next[j].pattern) {
        setActiveLayer(j);
        break;
      }
    }
  };

  // ---------- Quick merge: long-press a pattern, then tap a second one ----------
  const startMerge = (pattern) => {
    setMergeFirst(pattern);
    if (hapticsOnRef.current) safeVibrate(20);
  };

  // Where the merged pattern goes depends on the current mode
  const placeMerged = (merged) => {
    if (hapticsOnRef.current) safeVibrate([12, 40, 12]);
    if (isLayerMode) {
      assignToLayer(merged); // selected layer slot
    } else if (isSequenceMode) {
      setSequence((prev) => [...prev, merged]); // end of the sequence
    } else {
      setSelectedPattern(merged); // plays in a loop like a single pattern
      setPlayKind('solo');
      startPlayback('solo', merged);
    }
  };

  const handlePatternClick = (pattern) => {
    // second tap of a quick merge
    if (mergeFirst && !isFusionMode) {
      const merged = buildFused([mergeFirst, pattern]);
      setMergeFirst(null);
      placeMerged(merged);
      return;
    }
    if (isLayerMode) {
      assignToLayer(pattern);
      return;
    }
    if (isFusionMode) {
      addToFusion(pattern);
      return;
    }
    if (isSequenceMode) {
      setSequence((prev) => [...prev, pattern]);
      return;
    }
    if (playKind === 'solo' && selectedPattern?.letter === pattern.letter) {
      stopPlayback();
      return;
    }
    setSelectedPattern(pattern);
    setPlayKind('solo');
    startPlayback('solo', pattern);
  };

  const toggleSequenceMode = () => {
    if (isPlaying) stopPlayback();
    if (isSequenceMode) setSequence([]);
    else setIsLayerMode(false);
    setIsSequenceMode(!isSequenceMode);
  };

  const playSequence = () => {
    if (sequence.length === 0) return;
    if (playKind === 'sequence') {
      stopPlayback();
      return;
    }
    setSelectedPattern(null);
    setPlayKind('sequence');
    startPlayback('sequence', null);
  };

  const clearSequence = () => {
    if (isPlaying) stopPlayback();
    setSequence([]);
  };

  const removeFromSequence = (index) => {
    const next = sequence.filter((_, i) => i !== index);
    setSequence(next);
    if (next.length === 0 && playKind === 'sequence') stopPlayback();
  };

  // ---------- Drag & drop reordering of the sequence (mouse + touch) ----------
  const startDrag = (e, index) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    dragRef.current = { from: index, over: index, after: false };
    setDragState({ from: index, over: index, after: false, x: e.clientX, y: e.clientY });
    document.body.style.userSelect = 'none';

    const onMove = (ev) => {
      const chip = dragChipRef.current;
      if (chip) chip.style.transform = `translate(${ev.clientX + 12}px, ${ev.clientY - 28}px)`;

      // auto-scroll when the finger / mouse nears the top or bottom edge
      if (ev.clientY < 70) window.scrollBy(0, -14);
      else if (ev.clientY > window.innerHeight - 70) window.scrollBy(0, 14);

      // find the frame under (or nearest to) the pointer
      const tiles = seqTileRefs.current.slice(0, sequenceRef.current.length);
      let best = -1;
      let bestD = Infinity;
      tiles.forEach((el, i) => {
        if (!el) return;
        const r = el.getBoundingClientRect();
        const inside =
          ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
        const dx = ev.clientX - (r.left + r.width / 2);
        const dy = ev.clientY - (r.top + r.height / 2);
        const dist = inside ? -1 : dx * dx + dy * dy;
        if (dist < bestD) {
          bestD = dist;
          best = i;
        }
      });
      if (best < 0 || !tiles[best]) return;
      const rb = tiles[best].getBoundingClientRect();
      const after = ev.clientX > rb.left + rb.width / 2;
      const d = dragRef.current;
      if (d && (d.over !== best || d.after !== after)) {
        d.over = best;
        d.after = after;
        setDragState((prev) => (prev ? { ...prev, over: best, after } : prev));
      }
    };

    const finish = (apply) => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
      document.body.style.userSelect = '';
      const d = dragRef.current;
      dragRef.current = null;
      setDragState(null);
      if (apply && d) {
        let to = d.after ? d.over + 1 : d.over;
        if (to !== d.from && to !== d.from + 1) {
          const seq = sequenceRef.current.slice();
          const [item] = seq.splice(d.from, 1);
          if (item) {
            if (to > d.from) to -= 1;
            seq.splice(to, 0, item);
            setSequence(seq);
          }
        }
      }
    };
    const onUp = () => finish(true);
    const onCancel = () => finish(false);

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  };

  // ---------- "Placed in the sequencer" feedback (animation + subtle vibration) ----------
  // Small floating counter, shown when the sequencer is scrolled out of view
  const showCounterPill = (n) => {
    let el = pillElRef.current;
    const isNew = !el;
    if (isNew) {
      el = document.createElement('div');
      Object.assign(el.style, {
        position: 'fixed',
        top: '12px',
        left: '50%',
        transform: 'translateX(-50%)',
        zIndex: '90',
        pointerEvents: 'none',
        padding: '6px 16px',
        borderRadius: '9999px',
        background: 'rgba(126,34,206,.95)',
        border: '1px solid #d8b4fe',
        color: '#fff',
        fontSize: '14px',
        fontWeight: '700',
        boxShadow: '0 6px 18px rgba(0,0,0,.45)'
      });
      document.body.appendChild(el);
      pillElRef.current = el;
    }
    el.textContent = `Sequence: ${n}`;
    if (el.animate) {
      el.animate(
        isNew
          ? [
              { opacity: 0, transform: 'translateX(-50%) translateY(-8px)' },
              { opacity: 1, transform: 'translateX(-50%) translateY(0)' }
            ]
          : [
              { transform: 'translateX(-50%) scale(1)' },
              { transform: 'translateX(-50%) scale(1.15)' },
              { transform: 'translateX(-50%) scale(1)' }
            ],
        { duration: isNew ? 160 : 250, easing: 'ease-out' }
      );
    }
    clearTimeout(pillTimerRef.current);
    pillTimerRef.current = setTimeout(() => {
      const cur = pillElRef.current;
      pillElRef.current = null;
      if (!cur) return;
      if (cur.animate) {
        const a = cur.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
        a.onfinish = () => cur.remove();
      } else {
        cur.remove();
      }
    }, 1400);
  };

  // A chip flies from the tapped pattern to its slot in the sequencer
  const flyChip = (fromEl, letter, tx, ty) => {
    const r = fromEl.getBoundingClientRect();
    const fx = r.left + r.width / 2;
    const fy = r.top + r.height / 2;
    const chip = document.createElement('div');
    chip.textContent = letter;
    Object.assign(chip.style, {
      position: 'fixed',
      left: '0',
      top: '0',
      zIndex: '100',
      pointerEvents: 'none',
      padding: '4px 10px',
      borderRadius: '8px',
      background: '#9333ea',
      border: '2px solid #fff',
      color: '#fff',
      fontSize: '14px',
      fontWeight: '700',
      boxShadow: '0 4px 14px rgba(0,0,0,.4)',
      willChange: 'transform, opacity'
    });
    document.body.appendChild(chip);
    if (!chip.animate) {
      chip.remove();
      return;
    }
    const a = chip.animate(
      [
        { transform: `translate(${fx}px, ${fy}px) translate(-50%, -50%) scale(1)`, opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) translate(-50%, -50%) scale(0.7)`, opacity: 0.9 }
      ],
      { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }
    );
    a.onfinish = () => chip.remove();
  };

  useEffect(() => {
    const prev = prevSeqLenRef.current;
    const len = sequence.length;
    prevSeqLenRef.current = len;
    if (len <= prev) return undefined; // only react when a pattern is ADDED (not on reorder / remove)

    const newIndex = len - 1;
    const added = sequence[newIndex];

    // subtle vibration (only if haptics are on and supported)
    if (hapticsOnRef.current) safeVibrate(10);

    const raf = requestAnimationFrame(() => {
      try {
        const tile = seqTileRefs.current[newIndex];
        let tx;
        let ty;
        let onScreen = false;
        if (tile) {
          const r = tile.getBoundingClientRect();
          if (r.bottom > 0 && r.top < window.innerHeight) {
            tx = r.left + r.width / 2;
            ty = r.top + r.height / 2;
            onScreen = true;
          }
        }
        if (!onScreen) {
          showCounterPill(len);
          tx = window.innerWidth / 2;
          ty = 28;
        }

        const entry = registryRef.current.get(`grid:${added.letter}`);
        const fromEl = entry && entry.tile;
        const flies = !!fromEl && tx !== undefined;
        if (flies) flyChip(fromEl, added.letter, tx, ty);
        const delay = flies ? 380 : 0; // let the chip arrive before the frame pops in

        if (tile && tile.animate) {
          tile.animate(
            [
              { transform: 'scale(0.4)', opacity: 0, boxShadow: '0 0 0 0 rgba(192,132,252,.9)' },
              { transform: 'scale(1.12)', opacity: 1, boxShadow: '0 0 0 10px rgba(192,132,252,0)', offset: 0.55 },
              { transform: 'scale(1)', opacity: 1, boxShadow: '0 0 0 0 rgba(192,132,252,0)' }
            ],
            { duration: 450, delay, easing: 'ease-out', fill: 'backwards' }
          );
        }
        const badge = seqCountRef.current;
        if (badge && badge.animate) {
          badge.animate(
            [{ transform: 'scale(1)' }, { transform: 'scale(1.5)' }, { transform: 'scale(1)' }],
            { duration: 350, delay, easing: 'ease-out' }
          );
        }
      } catch (e) {
        /* animation is cosmetic: never break the app */
      }
    });
    return () => cancelAnimationFrame(raf);
  }, [sequence]);

  useEffect(
    () => () => {
      clearTimeout(pillTimerRef.current);
      if (pillElRef.current) pillElRef.current.remove();
    },
    []
  );

  // Long-press (touch / pen) or press-and-move (mouse) on a frame starts the drag
  const onTilePointerDown = (e, index) => {
    if (e.target.closest && e.target.closest('button')) return; // leave the × button alone
    const isMouse = e.pointerType === 'mouse';
    if (isMouse && e.button !== 0) return;
    const startX = e.clientX;
    const startY = e.clientY;
    let lastX = startX;
    let lastY = startY;
    let timer = null;

    const stopWaiting = () => {
      clearTimeout(timer);
      window.removeEventListener('pointermove', onWaitMove);
      window.removeEventListener('pointerup', stopWaiting);
      window.removeEventListener('pointercancel', stopWaiting);
    };
    const begin = () => {
      stopWaiting();
      if (hapticsOnRef.current) safeVibrate(15); // little "pick-up" buzz
      startDrag({ button: 0, clientX: lastX, clientY: lastY, preventDefault() {} }, index);
    };
    function onWaitMove(ev) {
      lastX = ev.clientX;
      lastY = ev.clientY;
      const moved = Math.hypot(lastX - startX, lastY - startY);
      if (isMouse) {
        if (moved > 4) begin();
      } else if (moved > 10) {
        stopWaiting(); // the finger is scrolling the page, not long-pressing
      }
    }

    window.addEventListener('pointermove', onWaitMove);
    window.addEventListener('pointerup', stopWaiting);
    window.addEventListener('pointercancel', stopWaiting);
    if (!isMouse) timer = setTimeout(begin, 350);
  };

  // Where to draw the drop marker for a given frame ('before' | 'after' | null)
  const dropSide = (index) => {
    if (!dragState || dragState.over !== index) return null;
    const to = dragState.after ? index + 1 : index;
    if (to === dragState.from || to === dragState.from + 1) return null; // would not move
    return dragState.after ? 'after' : 'before';
  };

  const toggleFusionMode = () => {
    if (isPlaying) stopPlayback();
    if (isFusionMode) {
      setFusionPatterns([]);
      setFusedPattern(null);
    } else {
      setIsLayerMode(false);
    }
    setIsFusionMode(!isFusionMode);
  };

  const addToFusion = (pattern) => {
    const next = [...fusionPatterns, pattern];
    setFusionPatterns(next);
    setFusedPattern(buildFused(next));
  };

  const clearFusion = () => {
    if (playKind === 'fused') stopPlayback();
    setFusionPatterns([]);
    setFusedPattern(null);
  };

  const playFusedPattern = () => {
    if (!fusedPattern) return;
    if (playKind === 'fused') {
      stopPlayback();
      return;
    }
    setSelectedPattern(null);
    setPlayKind('fused');
    startPlayback('fused', null);
  };

  const addFusedToSequence = () => {
    if (!fusedPattern) return;
    setSequence([...sequence, fusedPattern]);
  };

  const removeFromFusion = (index) => {
    const next = fusionPatterns.filter((_, i) => i !== index);
    setFusionPatterns(next);
    if (next.length === 0) {
      setFusedPattern(null);
      if (playKind === 'fused') stopPlayback();
    } else {
      setFusedPattern(buildFused(next));
    }
  };

  const toggleLayerMode = () => {
    if (isPlaying) stopPlayback();
    if (!isLayerMode) {
      // Layer Mode replaces the other builders (their content is kept)
      setIsSequenceMode(false);
      setIsFusionMode(false);
    }
    setIsLayerMode(!isLayerMode);
  };

  const hasLayers = layers.some((l) => l.pattern);

  const playLayers = () => {
    if (!hasLayers) return;
    if (playKind === 'layers') {
      stopPlayback();
      return;
    }
    setSelectedPattern(null);
    setPlayKind('layers');
    startPlayback('layers', null);
  };

  const clearLayer = (index) => {
    setLayers((prev) => prev.map((l, i) => (i === index ? { ...l, pattern: null } : l)));
    setActiveLayer(index);
  };

  const clearAllLayers = () => {
    if (playKind === 'layers') stopPlayback();
    setLayers((prev) => prev.map((l) => ({ ...l, pattern: null })));
    setActiveLayer(0);
  };

  const setLayerInstrument = (index, instrument) => {
    setLayers((prev) => prev.map((l, i) => (i === index ? { ...l, instrument } : l)));
  };

  // ---------- Tempo: slider, typed value, and +/- buttons ----------
  const clampTempo = (v) => Math.min(300, Math.max(1, Math.round(v)));

  const changeTempo = (v) => {
    const next = clampTempo(v);
    setTempo(next);
    settingsRef.current.tempo = next; // the very next scheduled beat already uses it
    const ctx = ctxRef.current;
    const p = playRef.current;
    if (p && ctx && nextBeatRef.current - ctx.currentTime > 1) {
      // a long beat (slow tempo) is already queued: restart so the new tempo is heard right away
      startPlayback(p.mode, p.pattern);
    }
  };

  const commitTempoDraft = () => {
    if (tempoSkipRef.current) {
      tempoSkipRef.current = false;
      setTempoDraft(null);
      return;
    }
    if (tempoDraft === null) return;
    const n = parseInt(tempoDraft, 10);
    if (!Number.isNaN(n)) changeTempo(n);
    setTempoDraft(null);
  };

  const stopTempoHold = () => {
    clearTimeout(tempoHoldRef.current.t);
    clearInterval(tempoHoldRef.current.i);
    tempoHoldRef.current = { t: null, i: null };
  };
  const startTempoHold = (delta) => {
    stopTempoHold();
    const step = () => changeTempo(settingsRef.current.tempo + delta);
    step();
    // hold the button to keep changing the tempo
    tempoHoldRef.current.t = setTimeout(() => {
      tempoHoldRef.current.i = setInterval(step, 70);
    }, 400);
  };
  useEffect(() => () => stopTempoHold(), []);

  // All sequencer frames share the size of the longest pattern in the sequence
  const seqMaxSteps = sequence.reduce((m, p) => Math.max(m, p.code.split(' ').length), 1);
  const seqTileWidth = Math.max(84, seqMaxSteps * 16 + 28);

  const infoPattern = playKind === 'solo' ? selectedPattern : playKind === 'fused' ? fusedPattern : null;

  /* ---------------- Render ---------------- */
  return (
    <div className="min-h-screen bg-gray-900 text-white p-6">
      <style>{CSS}</style>

      {/* Quick-merge banner + "Merged" player (fixed at the bottom of the screen) */}
      {(mergeFirst || (playKind === 'solo' && selectedPattern && selectedPattern.parts)) && (
        <div
          style={{
            position: 'fixed',
            left: 12,
            right: 12,
            bottom: 12,
            zIndex: 80,
            display: 'flex',
            flexDirection: 'column',
            gap: 8,
            pointerEvents: 'none'
          }}
        >
          {playKind === 'solo' && selectedPattern && selectedPattern.parts && (
            <div
              className="rounded-lg border-2 border-blue-400 bg-blue-950 p-3 shadow-lg"
              style={{ pointerEvents: 'auto' }}
            >
              <div className="flex items-center gap-2">
                <div className="flex-shrink-0">
                  <div className="text-xs text-blue-300">Merged</div>
                  <div className="text-sm font-bold">
                    {selectedPattern.parts.map((p) => p.letter).join(' + ')}
                  </div>
                </div>
                <div className="flex-1 min-w-0">
                  <PatternView
                    viewId={`grid:${selectedPattern.letter}`}
                    pattern={selectedPattern}
                    registry={registryRef}
                    size="md"
                  />
                </div>
                <button
                  onClick={stopPlayback}
                  className="flex-shrink-0 flex items-center gap-1 px-3 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm"
                >
                  <Pause size={16} />
                  Stop
                </button>
              </div>
            </div>
          )}
          {mergeFirst && (
            <div
              className="rounded-lg border-2 border-amber-400 bg-gray-900 p-3 shadow-lg flex items-center justify-between gap-3"
              style={{ pointerEvents: 'auto' }}
            >
              <span className="text-sm">
                Merge <strong className="text-amber-300">{mergeFirst.letter}</strong> with: tap another pattern
              </span>
              <button
                onClick={() => setMergeFirst(null)}
                className="px-3 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-sm"
              >
                Cancel
              </button>
            </div>
          )}
        </div>
      )}

      {/* Floating chip while dragging a sequence frame */}
      {dragState && sequence[dragState.from] && (
        <div
          ref={dragChipRef}
          className="px-3 py-1.5 rounded-lg bg-purple-600 border-2 border-white text-sm font-bold shadow-lg"
          style={{
            position: 'fixed',
            left: 0,
            top: 0,
            zIndex: 100,
            pointerEvents: 'none',
            transform: `translate(${dragState.x + 12}px, ${dragState.y - 28}px)`
          }}
        >
          {sequence[dragState.from].letter}
        </div>
      )}

      <div className="max-w-7xl mx-auto">
        {/* Header */}
        <div className="mb-8">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h1 className="text-4xl font-bold mb-2">
                <span className="text-green-400">A</span>
                <span className="text-yellow-400">B</span>
                <span className="text-white">E</span>
                <span className="text-white">L</span>{' '}
                <span className="text-white">Rhyth</span>
                <span className="text-green-400">m</span>{' '}
                <span className="text-green-400">A</span>
                <span className="text-white">lph</span>
                <span className="text-green-400">a</span>
                <span className="text-yellow-400">b</span>
                <span className="text-white">et</span>
              </h1>
              <p className="text-gray-400">
                See it. Feel it. Hear it. Play it. •{' '}
                <a
                  href="https://www.abeldominoes.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-blue-400 hover:text-blue-300 underline transition-colors"
                >
                  abeldominoes.com
                </a>
              </p>
            </div>
            <button
              onClick={() => setShowInfo(!showInfo)}
              className="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors"
            >
              <Info size={24} />
            </button>
          </div>

          {showInfo && (
            <div className="bg-gray-800 rounded-lg p-4 mb-4">
              <h3 className="font-bold mb-2">How it works:</h3>
              <ul className="text-sm text-gray-300 space-y-1">
                <li>• <strong>Dot (•)</strong> = sound/attack</li>
                <li>• <strong>Dash (–)</strong> = rest/silence (or ghost note if enabled)</li>
                <li>• <strong>A</strong> (Pulse) → <strong>B</strong> (2 Halves) → <strong>E</strong> (3 Thirds) → <strong>L</strong> (4 Quarters)</li>
                <li>• <strong>Single Pattern Mode:</strong> Click a pattern to start loop, click again to stop</li>
                <li>• <strong>Sequence Mode:</strong> Click patterns to add them to your sequence, press and hold a frame to drag it to a new position, then play the sequence in loop</li>
                <li>• <strong>Fusion Mode:</strong> Combine patterns to create complex subdivisions (e.g., E+E = sextolet, B+E = quintolet)</li>
                <li>• <strong>Layer Mode:</strong> Play up to 4 patterns at the same time, each with its own instrument (including patterns built in Fusion Mode)</li>
                <li>• <strong>Quick Merge:</strong> Press and hold a pattern, then tap a second one to merge them. In Single Pattern Mode the merged pattern plays in a loop, in Sequence Mode it is added to the sequence, and in Layer Mode it goes into the selected slot</li>
              </ul>
            </div>
          )}

          {/* Tempo / Sound Controls */}
          <div className="bg-gray-800 rounded-lg p-4 space-y-3">
            <div className="space-y-2">
              <div className="flex items-center gap-2">
                <Volume2 size={20} />
                <button
                  onPointerDown={() => startTempoHold(-1)}
                  onPointerUp={stopTempoHold}
                  onPointerLeave={stopTempoHold}
                  onPointerCancel={stopTempoHold}
                  onContextMenu={(e) => e.preventDefault()}
                  className="w-9 h-9 rounded bg-gray-700 hover:bg-gray-600 font-bold text-lg select-none"
                  style={{ touchAction: 'manipulation' }}
                  aria-label="Decrease tempo"
                >
                  −
                </button>
                <input
                  type="text"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  maxLength={3}
                  aria-label="Tempo in BPM"
                  value={tempoDraft !== null ? tempoDraft : String(tempo)}
                  onFocus={(e) => {
                    const el = e.target;
                    setTempoDraft(String(tempo));
                    setTimeout(() => el.select(), 0);
                  }}
                  onChange={(e) => setTempoDraft(e.target.value.replace(/[^0-9]/g, '').slice(0, 3))}
                  onBlur={commitTempoDraft}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') {
                      e.currentTarget.blur();
                    } else if (e.key === 'Escape') {
                      tempoSkipRef.current = true;
                      e.currentTarget.blur();
                    }
                  }}
                  className="w-16 h-9 text-center font-mono text-lg bg-gray-700 border border-gray-600 rounded"
                />
                <button
                  onPointerDown={() => startTempoHold(1)}
                  onPointerUp={stopTempoHold}
                  onPointerLeave={stopTempoHold}
                  onPointerCancel={stopTempoHold}
                  onContextMenu={(e) => e.preventDefault()}
                  className="w-9 h-9 rounded bg-gray-700 hover:bg-gray-600 font-bold text-lg select-none"
                  style={{ touchAction: 'manipulation' }}
                  aria-label="Increase tempo"
                >
                  +
                </button>
                {tempoDraft !== null ? (
                  <button
                    onPointerDown={(e) => {
                      e.preventDefault();
                      commitTempoDraft();
                      if (document.activeElement) document.activeElement.blur();
                    }}
                    className="px-3 h-9 rounded bg-green-600 hover:bg-green-700 text-sm font-bold"
                  >
                    Set
                  </button>
                ) : (
                  <span className="text-sm text-gray-400">BPM</span>
                )}
              </div>
              <input
                type="range"
                min="1"
                max="300"
                value={tempo}
                onChange={(e) => changeTempo(Number(e.target.value))}
                className="w-full"
              />
            </div>

            {/* Beats per bar + beat indicator (synced with the metronome clock) */}
            <div className="flex items-center gap-3 flex-wrap">
              <span className="text-sm text-gray-400">Beats per bar</span>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setBeatsPerBar((b) => Math.max(1, b - 1))}
                  className="w-7 h-7 rounded bg-gray-700 hover:bg-gray-600 font-bold"
                  aria-label="Fewer beats"
                >
                  −
                </button>
                <span className="w-6 text-center font-mono">{beatsPerBar}</span>
                <button
                  onClick={() => setBeatsPerBar((b) => Math.min(16, b + 1))}
                  className="w-7 h-7 rounded bg-gray-700 hover:bg-gray-600 font-bold"
                  aria-label="More beats"
                >
                  +
                </button>
              </div>
              <div ref={beatsContainerRef} className="flex flex-wrap gap-2 items-center">
                {Array.from({ length: beatsPerBar }).map((_, i) => (
                  <div key={i} data-beat className="abel-beat" />
                ))}
              </div>
            </div>

            {/* A/V sync fine-tuning (hidden by default) */}
            <button
              onClick={() => setShowSync((v) => !v)}
              className="text-xs text-gray-400 hover:text-gray-200 underline"
            >
              {showSync ? 'Hide' : 'Show'} animation delay
            </button>
            {showSync && (
              <>
                <div className="flex items-center gap-4">
                  <label className="text-sm whitespace-nowrap">Animation delay: {syncOffset} ms</label>
                  <input
                    type="range"
                    min="0"
                    max="400"
                    step="5"
                    value={syncOffset}
                    onChange={(e) => setSyncOffset(Number(e.target.value))}
                    className="flex-1"
                  />
                </div>
                <div className="text-xs text-gray-500 -mt-1">
                  Keep at 0 for speakers. Increase it if the animation appears before you hear the sound (e.g. Bluetooth headphones).
                </div>
              </>
            )}

            {/* Instrument Selector (hidden in Layer Mode: each layer has its own) */}
            {!isLayerMode && (
              <div className="border-t border-gray-700 pt-3 flex items-center gap-3">
                <label htmlFor="instrument" className="text-sm font-bold whitespace-nowrap">
                  Instrument:
                </label>
                <select
                  id="instrument"
                  value={selectedInstrument}
                  onChange={(e) => setSelectedInstrument(e.target.value)}
                  className="flex-1 bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-sm"
                >
                  {Object.entries(INSTRUMENTS).map(([key, inst]) => (
                    <option key={key} value={key}>
                      {inst.name}
                    </option>
                  ))}
                </select>
              </div>
            )}

            <div className="border-t border-gray-700 pt-3 space-y-2">
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="metronome"
                  checked={metronomeEnabled}
                  onChange={(e) => setMetronomeEnabled(e.target.checked)}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="metronome" className="text-sm cursor-pointer">
                  Metronome (click on beats)
                </label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="ghostnotes"
                  checked={ghostNotesEnabled}
                  onChange={(e) => setGhostNotesEnabled(e.target.checked)}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="ghostnotes" className="text-sm cursor-pointer">
                  Ghost Notes (play dashes at low volume)
                </label>
              </div>
              <div className="flex items-center gap-3">
                <button
                  role="switch"
                  aria-checked={hapticsEnabled && hapticsSupported}
                  aria-label="Haptic feedback"
                  onClick={toggleHaptics}
                  disabled={!hapticsSupported}
                  className={`relative w-11 h-6 rounded-full transition-colors flex-shrink-0 ${
                    hapticsEnabled && hapticsSupported ? 'bg-green-500' : 'bg-gray-600'
                  } ${hapticsSupported ? '' : 'opacity-40 cursor-not-allowed'}`}
                >
                  <span
                    className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition-transform ${
                      hapticsEnabled && hapticsSupported ? 'translate-x-5' : ''
                    }`}
                  />
                </button>
                <span className="text-sm">
                  Haptic feedback (vibrate on beats and notes)
                  {!hapticsSupported && (
                    <span className="block text-xs text-gray-500">Not supported on this device or browser</span>
                  )}
                </span>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="sequencemode"
                  checked={isSequenceMode}
                  onChange={toggleSequenceMode}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="sequencemode" className="text-sm cursor-pointer font-bold">
                  Sequence Mode (build custom rhythm sequences)
                </label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="fusionmode"
                  checked={isFusionMode}
                  onChange={toggleFusionMode}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="fusionmode" className="text-sm cursor-pointer font-bold">
                  Fusion Mode (combine patterns for complex subdivisions)
                </label>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="layermode"
                  checked={isLayerMode}
                  onChange={toggleLayerMode}
                  className="w-4 h-4 rounded"
                />
                <label htmlFor="layermode" className="text-sm cursor-pointer font-bold">
                  Layer Mode (play up to 4 patterns at once, each with its own instrument)
                </label>
              </div>
            </div>
          </div>

          {/* Layer Builder */}
          {isLayerMode && (
            <div className="bg-emerald-900/30 border-2 border-emerald-500 rounded-lg p-4 mt-4">
              <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
                <h3 className="text-lg font-bold">Layer Mode</h3>
                <div className="flex gap-2">
                  <button
                    onClick={playLayers}
                    disabled={!hasLayers}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                      !hasLayers
                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                        : 'bg-emerald-600 hover:bg-emerald-700'
                    }`}
                  >
                    {playKind === 'layers' ? <Pause size={16} /> : <Play size={16} />}
                    {playKind === 'layers' ? 'Stop' : 'Play'} Layers
                  </button>
                  <button
                    onClick={clearAllLayers}
                    disabled={!hasLayers}
                    className={`px-4 py-2 rounded-lg transition-colors ${
                      !hasLayers
                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                        : 'bg-red-600 hover:bg-red-700'
                    }`}
                  >
                    Clear
                  </button>
                </div>
              </div>
              <div className="text-xs text-gray-400 mb-3">
                Tap a slot, then tap a pattern below (or your fused pattern) to place it. Each slot plays with its own instrument, all at the same time.
              </div>
              {fusedPattern && (
                <button
                  onClick={() => assignToLayer(fusedPattern)}
                  className="w-full text-left rounded-lg p-2 mb-3 border-2 border-blue-400 bg-gray-800 hover:bg-gray-700 transition-colors"
                >
                  <div className="text-xs text-blue-300 mb-1">
                    Your fused pattern: tap to place it in the selected slot
                  </div>
                  <div className="flex items-center gap-2">
                    <span
                      className="text-xs font-bold text-blue-400 flex-shrink-0 truncate"
                      style={{ minWidth: 24, maxWidth: 56 }}
                    >
                      {fusedPattern.letter}
                    </span>
                    <div className="flex-1 min-w-0">
                      <PatternView
                        viewId="layer-fused-tray"
                        pattern={fusedPattern}
                        registry={registryRef}
                        size="sm"
                        bar={false}
                      />
                    </div>
                  </div>
                </button>
              )}

              <div className="space-y-2">
                {layers.map((layer, i) => (
                  <div
                    key={i}
                    data-tile
                    onClick={() => setActiveLayer(i)}
                    className={`abel-tile flex items-center gap-2 rounded-lg p-2 border-2 cursor-pointer ${
                      activeLayer === i ? 'border-emerald-400 bg-gray-700' : 'border-gray-600 bg-gray-800'
                    }`}
                  >
                    <div
                      className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center flex-shrink-0 ${
                        activeLayer === i ? 'bg-emerald-500 text-gray-900' : 'bg-gray-600'
                      }`}
                    >
                      {i + 1}
                    </div>

                    <div className="flex-1 min-w-0">
                      {layer.pattern ? (
                        <div className="flex items-center gap-2">
                          <span
                            className="text-xs font-bold flex-shrink-0 truncate"
                            style={{ color: accentFor(layer.pattern.color), minWidth: 24, maxWidth: 56 }}
                          >
                            {layer.pattern.letter}
                          </span>
                          <div className="flex-1 min-w-0">
                            <PatternView
                              viewId={`layer:${i}`}
                              pattern={layer.pattern}
                              registry={registryRef}
                              size="md"
                            />
                          </div>
                        </div>
                      ) : (
                        <div className="text-xs text-gray-500 py-3">Empty: tap a pattern below</div>
                      )}
                    </div>

                    <select
                      value={layer.instrument}
                      onChange={(e) => setLayerInstrument(i, e.target.value)}
                      className="w-32 flex-shrink-0 bg-gray-700 border border-gray-600 rounded px-1 py-1.5 text-xs"
